---

- id: c8cb2ea6-1b8f-40eb-8b9b-b225f0368497
  name: Surf the Web
  description: |
    Casual web browsing — opens the platform default browser, navigates
    to a couple of news/dev sites, reads each, scrolls, switches tabs,
    closes one, then runs an in-page search. Composed entirely of
    OS-native hotkey-driven HID atomic abilities (no coordinate
    dependence, no shell-cradle). Materializes for windows / linux /
    darwin via per-ability platform branches.
  adversary_persona: benign-office-worker
  duration_estimate_s: 90
  tags:
    - benign-human-activity
    - human-profile
    - browsing
  steps:
    - { ability: open-default-browser }
    - { ability: dwell-natural }
    - { ability: focus-address-bar-v2 }
    - { ability: navigate-to-url, args: { url: "https://news.ycombinator.com" } }
    - { ability: dwell-reading }
    - { ability: scroll-page, args: { direction: down, ticks: 5 } }
    - { ability: dwell-reading }
    - { ability: scroll-page, args: { direction: down, ticks: 4 } }
    - { ability: dwell-natural }
    - { ability: open-new-tab }
    - { ability: focus-address-bar-v2 }
    - { ability: navigate-to-url, args: { url: "https://github.com" } }
    - { ability: dwell-reading }
    - { ability: scroll-page, args: { direction: down, ticks: 3 } }
    - { ability: dwell-natural }
    - { ability: switch-tab }
    - { ability: dwell-natural }
    - { ability: close-current-tab }
    - { ability: focus-address-bar-v2 }
    - { ability: navigate-to-url, args: { url: "https://www.google.com" } }
    - { ability: dwell-natural }
    - { ability: focus-page-search, args: { query: "weather san francisco" } }
    - { ability: dwell-reading }
