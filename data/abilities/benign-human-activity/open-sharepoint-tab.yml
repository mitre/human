---

- id: ef5e4ad6-96b1-4c5a-bfed-697c00d839ea
  name: Open SharePoint Tab
  description: Simulates a user clicking through to their corporate SharePoint
    in the default browser. Stub - purely for the network signature
    (DNS + TLS-SNI for *.sharepoint.com). Useful as a benign overlay alongside
    OneDrive / Teams traffic generated by other abilities.
  tactic: benign-human-activity
  technique:
    attack_id: x_human_sharepoint
    name: Benign User Activity - SharePoint
  platforms:
    windows:
      psh:
        command: |
          $url = "https://company.sharepoint.com"
          Start-Process $url
    linux:
      sh:
        command: |
          URL="https://company.sharepoint.com"
          if command -v xdg-open >/dev/null 2>&1; then
            xdg-open "$URL" >/dev/null 2>&1 &
          else
            echo "DEBUG: xdg-open not present; skipping"
          fi
    darwin:
      sh:
        command: |
          open "https://company.sharepoint.com"
  additional_info:
    human: true
    benign: true
