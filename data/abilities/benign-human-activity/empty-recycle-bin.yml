---

- id: 636659d9-2e5d-42cf-9262-b87ca3e5e52e
  name: Empty Recycle Bin / Cache
  description: Simulates a user tidying up. On Windows clears the Recycle Bin
    via Clear-RecycleBin. On Linux removes thumbnail cache files under
    ~/.cache/thumbnails (a bounded, recoverable cleanup). Both fail silently
    if the target is empty or unavailable.
  tactic: benign-human-activity
  technique:
    attack_id: x_human_cleanup
    name: Benign User Activity - Cleanup
  platforms:
    windows:
      psh:
        command: |
          try {
            Clear-RecycleBin -Force -ErrorAction Stop
            Write-Output "recycle bin emptied"
          } catch {
            Write-Output "recycle bin already empty or unavailable"
          }
    linux:
      sh:
        command: |
          if [ -d "$HOME/.cache/thumbnails" ]; then
            find "$HOME/.cache/thumbnails" -mindepth 1 -type f -delete 2>/dev/null || true
            echo "thumbnails cache cleared"
          else
            echo "no thumbnails cache; skipping"
          fi
    darwin:
      sh:
        command: |
          if [ -d "$HOME/.Trash" ]; then
            find "$HOME/.Trash" -mindepth 1 -delete 2>/dev/null || true
            echo "trash cleared"
          fi
  additional_info:
    human: true
    benign: true
