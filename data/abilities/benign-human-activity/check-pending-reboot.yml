---

- id: a4889e88-0c7a-44e2-afd9-dc589ac1145b
  name: Check Pending Reboot
  description: Simulates an admin / power-user checking whether the host needs
    to reboot to finish patching. READ-ONLY - never reboots. On Windows tests
    several well-known registry locations (Component Based Servicing, Windows
    Update, PendingFileRenameOperations) and emits a single-line verdict. On
    Linux checks /var/run/reboot-required.
  tactic: benign-human-activity
  technique:
    attack_id: x_human_pending_reboot
    name: Benign User Activity - Pending Reboot Probe
  platforms:
    windows:
      psh:
        command: |
          $pending = $false
          if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending') { $pending = $true }
          if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired') { $pending = $true }
          try {
            $pfro = Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue
            if ($pfro -and $pfro.PendingFileRenameOperations) { $pending = $true }
          } catch {}
          if ($pending) { Write-Host "REBOOT-PENDING" } else { Write-Host "NONE" }
    linux:
      sh:
        command: |
          if [ -f /var/run/reboot-required ]; then
            echo "REBOOT-PENDING"
            [ -f /var/run/reboot-required.pkgs ] && cat /var/run/reboot-required.pkgs
          else
            echo "NONE"
          fi
    darwin:
      sh:
        command: |
          if softwareupdate -l 2>&1 | grep -qi "restart"; then
            echo "REBOOT-PENDING"
          else
            echo "NONE"
          fi
  additional_info:
    human: true
    benign: true
