---
# Hard-refresh the foreground browser tab (bypasses HTTP cache).
# Ctrl+Shift+R on Windows/Linux; Cmd+Shift+R on macOS. Small reusable
# atomic — not Turla-specific, just absent from the stock benign-human-
# activity set (which has no refresh ability at all).

- id: 7ae00001-7e91-4d6b-9c45-100400060005
  name: Browser Hard Refresh
  description: |
    Fire the cache-bypassing hard-reload chord in the foreground browser.
    Ctrl+Shift+R on Windows/Linux, Cmd+Shift+R on macOS. Pair with a
    short dwell afterwards so the page has time to repaint.
  tactic: benign-human-activity
  technique:
    attack_id: x_human_browser_hard_refresh
    name: Benign User Activity - Browser Hard Refresh
  plugin: human
  tags: [interaction, browser]

  args:
    settle_ms:
      description: How long to wait_for after the chord so the page repaints.
      default: 1200

  platforms:
    windows:
      steps:
        - { action: chord, keys: [LeftCtrl, LeftShift, r], hold_ms: 80 }
        - { action: dwell, ms: { mean: 250, jitter: 80 } }
        - { action: wait_for, ms: "{{ args.settle_ms }}" }
    linux:
      steps:
        - { action: chord, keys: [LeftCtrl, LeftShift, r], hold_ms: 80 }
        - { action: dwell, ms: { mean: 250, jitter: 80 } }
        - { action: wait_for, ms: "{{ args.settle_ms }}" }
    darwin:
      steps:
        - { action: chord, keys: [LeftMeta, LeftShift, r], hold_ms: 80 }
        - { action: dwell, ms: { mean: 250, jitter: 80 } }
        - { action: wait_for, ms: "{{ args.settle_ms }}" }
