---

- id: 4db9db58-f1c6-449f-8d70-79e0797e5ca6
  name: Scroll Down
  description: |
    User scrolls the foreground window down N notches. Wheel events
    only — no movement of the cursor. Use after a dwell to look like
    "read, then scroll for more".
  tactic: benign-human-activity
  technique:
    attack_id: x_human_scroll_down
    name: Benign User Activity - Scroll Down
  hid:
    estimated_duration_s: 1
    requires:
      - tablet
    args:
      - name: ticks
        type: int
        default: 4
        description: How many wheel notches to scroll down.
    steps:
      - action: scroll
        wheel: down
        ticks: "{{ args.ticks }}"
