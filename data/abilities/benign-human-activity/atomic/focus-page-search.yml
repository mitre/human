---

- id: focus-page-search
  name: Focus Page Search
  description: |
    Open the in-page Find bar (Ctrl+F / Cmd+F). If args.query is set,
    types it after focusing the search field. Useful for "user looked
    for a phrase on the page" behavior.
  tactic: benign-human-activity
  technique:
    attack_id: x_human_focus_page_search
    name: Benign User Activity - Focus Page Search
  plugin: human
  tags: [interaction, browser, search]
  args:
    query:
      description: Optional string to type after opening Find.
      default: ""
  platforms:
    windows:
      steps:
        - { action: chord, keys: [LeftControl, f], hold_ms: 50 }
        - { action: dwell, ms: 250 }
        - { action: type, text: "{{ args.query }}", per_char_ms: 130 }
    linux:
      steps:
        - { action: chord, keys: [LeftControl, f], hold_ms: 50 }
        - { action: dwell, ms: 250 }
        - { action: type, text: "{{ args.query }}", per_char_ms: 130 }
    darwin:
      steps:
        - { action: chord, keys: [LeftMeta, f], hold_ms: 50 }
        - { action: dwell, ms: 250 }
        - { action: type, text: "{{ args.query }}", per_char_ms: 130 }
