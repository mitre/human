---

- id: press-key
  name: Press Key
  description: |
    Press a single arbitrary key (e.g. Escape, F4, F5, Tab, Backspace,
    Home, End, ArrowDown). Useful for translated legacy workflows that
    issue isolated keystrokes the more specialized atomics don't cover.
    Same on every desktop OS — single key event, no chord.
  tactic: benign-human-activity
  technique:
    attack_id: x_human_press_key
    name: Benign User Activity - Press Key
  plugin: human
  tags: [interaction, keyboard]
  args:
    key:
      description: Key name as understood by the keyboard daemon (e.g. Escape, F4, Tab).
      default: Enter
  platforms:
    windows:
      steps:
        - { action: press, key: "{{ args.key }}" }
        - { action: dwell, ms: 100 }
    linux:
      steps:
        - { action: press, key: "{{ args.key }}" }
        - { action: dwell, ms: 100 }
    darwin:
      steps:
        - { action: press, key: "{{ args.key }}" }
        - { action: dwell, ms: 100 }
