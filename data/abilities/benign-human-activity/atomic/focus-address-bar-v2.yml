---

- id: focus-address-bar-v2
  name: Focus Address Bar
  description: |
    Press the platform-appropriate hotkey to focus the address bar of
    the foreground browser. Ctrl+L on Windows/Linux; Cmd+L on macOS.
    Works in every major browser.
  tactic: benign-human-activity
  technique:
    attack_id: x_human_focus_addr_v2
    name: Benign User Activity - Focus Address Bar
  plugin: human
  tags: [interaction, browser]
  platforms:
    windows:
      steps:
        - { action: chord, keys: [LeftControl, l], hold_ms: 50 }
        - { action: dwell, ms: 150 }
    linux:
      steps:
        - { action: chord, keys: [LeftControl, l], hold_ms: 50 }
        - { action: dwell, ms: 150 }
    darwin:
      steps:
        - { action: chord, keys: [LeftMeta, l], hold_ms: 50 }
        - { action: dwell, ms: 150 }
