---

- id: close-current-tab
  name: Close Current Tab
  description: |
    Close the currently-focused browser tab (Ctrl+W / Cmd+W). If only
    one tab is open, this closes the window.
  tactic: benign-human-activity
  technique:
    attack_id: x_human_close_tab
    name: Benign User Activity - Close Current Tab
  plugin: human
  tags: [interaction, browser]
  platforms:
    windows:
      steps:
        - { action: chord, keys: [LeftControl, w], hold_ms: 50 }
        - { action: dwell, ms: 200 }
    linux:
      steps:
        - { action: chord, keys: [LeftControl, w], hold_ms: 50 }
        - { action: dwell, ms: 200 }
    darwin:
      steps:
        - { action: chord, keys: [LeftMeta, w], hold_ms: 50 }
        - { action: dwell, ms: 200 }
