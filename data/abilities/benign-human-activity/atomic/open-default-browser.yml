---

- id: open-default-browser
  name: Open Default Browser
  description: |
    Opens the platform's default browser via OS-native launcher hotkey
    (Win+R / Super / Cmd+Space). No coordinate dependence — keys only.
  tactic: benign-human-activity
  technique:
    attack_id: x_human_open_browser
    name: Benign User Activity - Open Browser
  plugin: human
  tags: [interaction, browser, launch]
  args:
    browser_command:
      description: Command typed into the launcher to open the browser.
      default:
        windows: msedge
        linux: firefox
        darwin: Firefox
  platforms:
    windows:
      # Win+R Run dialog -> type browser command -> Enter.
      steps:
        - { action: chord, keys: [LeftMeta, r], hold_ms: 50 }
        - { action: dwell, ms: 400 }
        - { action: type, text: "{{ args.browser_command }}", per_char_ms: 90 }
        - { action: dwell, ms: 200 }
        - { action: press, key: Enter }
        - { action: wait_for, ms: 2500 }
    linux:
      # GNOME/KDE: Super opens the activities/launcher overlay.
      steps:
        - { action: press, key: LeftMeta }
        - { action: dwell, ms: 500 }
        - { action: type, text: "{{ args.browser_command }}", per_char_ms: 90 }
        - { action: dwell, ms: 300 }
        - { action: press, key: Enter }
        - { action: wait_for, ms: 2500 }
    darwin:
      # Cmd+Space opens Spotlight; type app name + Enter.
      steps:
        - { action: chord, keys: [LeftMeta, space], hold_ms: 50 }
        - { action: dwell, ms: 400 }
        - { action: type, text: "{{ args.browser_command }}", per_char_ms: 90 }
        - { action: dwell, ms: 200 }
        - { action: press, key: Enter }
        - { action: wait_for, ms: 2500 }
