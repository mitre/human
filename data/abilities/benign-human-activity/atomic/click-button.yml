---

- id: click-button
  name: Click Button
  description: |
    Emit a single HID tablet click at the current cursor position.
    Intended for profiles that already moved the cursor explicitly.
  tactic: benign-human-activity
  technique:
    attack_id: x_human_click_button
    name: Benign User Activity - Click Button
  hid:
    estimated_duration_s: 1
    requires:
      - tablet
    args:
      - name: button
        type: string
        default: left
        description: Mouse button to click.
    steps:
      - action: click
        button: "{{ args.button }}"
