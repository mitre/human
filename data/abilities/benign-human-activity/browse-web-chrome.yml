---

- id: ca1bfa41-3bfa-4932-8aca-3e4209bff289
  name: Browse Web (Chrome)
  description: Specifically launches Chrome (or Chromium) against a benign URL
    so process telemetry shows a chrome.exe / google-chrome process tree -
    distinct from the default-browser path used by Browse Web (News). Falls
    back to msedge.exe on Windows or xdg-open on Linux when Chrome is absent.
  tactic: benign-human-activity
  technique:
    attack_id: x_human_chrome
    name: Benign User Activity - Chrome Browsing
  platforms:
    windows:
      psh:
        command: |
          $url = "https://www.wikipedia.org"
          $chrome = Get-Command chrome.exe -ErrorAction SilentlyContinue
          if (-not $chrome) {
            $candidates = @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
              "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
            )
            $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if ($chrome) {
            Start-Process $chrome $url
          } else {
            $edge = Get-Command msedge.exe -ErrorAction SilentlyContinue
            if ($edge) {
              Start-Process msedge.exe $url
            } else {
              Write-Host "DEBUG: neither Chrome nor Edge installed; skipping"
            }
          }
    linux:
      sh:
        command: |
          URL="https://www.wikipedia.org"
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --no-sandbox "$URL" >/dev/null 2>&1 &
          elif command -v chromium >/dev/null 2>&1; then
            chromium --no-sandbox "$URL" >/dev/null 2>&1 &
          elif command -v chromium-browser >/dev/null 2>&1; then
            chromium-browser --no-sandbox "$URL" >/dev/null 2>&1 &
          elif command -v xdg-open >/dev/null 2>&1; then
            xdg-open "$URL" >/dev/null 2>&1 &
          else
            echo "DEBUG: no Chrome/Chromium/xdg-open available; skipping"
          fi
    darwin:
      sh:
        command: |
          if [ -d "/Applications/Google Chrome.app" ]; then
            open -a "Google Chrome" "https://www.wikipedia.org"
          else
            open "https://www.wikipedia.org"
          fi
  additional_info:
    human: true
    benign: true
