---

- id: fee7dbb5-7865-4326-a6f8-ace6c61fd9d6
  name: Reply Email (Outlook)
  description: |
    Simulates a user replying to email. On Windows, attempts to launch
    Outlook via the mailto: URI scheme so the system's default mail handler
    composes a draft. If Outlook COM is available, opens a compose window
    silently. Falls back to opening webmail compose in the default browser when
    no native mail client is registered. On Linux, uses xdg-open with a mailto:
    URI so the desktop environment routes to its registered handler.
  tactic: benign-human-activity
  technique:
    attack_id: x_human_replyemail
    name: Benign User Activity - Email Reply
  platforms:
    windows:
      psh:
        command: |
          $mailto = "mailto:colleague@example.com?subject=RE:%20status%20update&body=Thanks,%20will%20circle%20back%20shortly."
          try {
            $ol = New-Object -ComObject Outlook.Application -ErrorAction Stop
            $mail = $ol.CreateItem(0)
            $mail.To = "colleague@example.com"
            $mail.Subject = "RE: status update"
            $mail.Body = "Thanks, will circle back shortly."
            $mail.Display() | Out-Null
            Start-Sleep -Seconds 5
          } catch {
            try {
              Start-Process $mailto -ErrorAction Stop
            } catch {
              Start-Process "https://outlook.live.com/mail/0/deeplink/compose?subject=RE:%20status%20update"
            }
          }
    linux:
      sh:
        command: |
          MAILTO="mailto:colleague@example.com?subject=RE:%20status%20update&body=Thanks,%20will%20circle%20back%20shortly."
          if command -v xdg-open >/dev/null 2>&1; then
            xdg-open "$MAILTO" >/dev/null 2>&1 &
          else
            echo "no mail handler available; skipping"
          fi
          sleep 2
    darwin:
      sh:
        command: |
          open "mailto:colleague@example.com?subject=RE:%20status%20update&body=Thanks,%20will%20circle%20back%20shortly."
          sleep 2
  additional_info:
    human: true
    benign: true
